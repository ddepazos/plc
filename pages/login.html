<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Acceso a PLC — Proletarian Coin">
  <title>Acceso — PLC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>
  <main class="auth-page">
    <section class="auth-card" aria-labelledby="auth-title">
      <a class="brand" href="../index.html">PLC</a>
      <p class="eyebrow">PROLETARIAN COIN</p>
      <h1 id="auth-title">ENTRA A TU CUENTA</h1>
      <div class="tabs" role="tablist" aria-label="Acceso y registro">
        <button type="button" role="tab" aria-selected="true">Iniciar sesión</button>
        <button type="button" role="tab" aria-selected="false">Registro</button>
      </div>
      <form action="dashboard.html">
        <label for="email">Email<input id="email" name="email" type="email" autocomplete="email" placeholder="tu@email.com" required></label>
        <label for="password">Contraseña<input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required></label>
        <div class="form-row"><label><input type="checkbox" name="remember"> Recordarme</label><a href="#">¿Olvidaste tu contraseña?</a></div>
        <button class="btn" type="submit">Iniciar sesión</button>
      </form>
      <div class="auth-social"><button type="button">Continuar con Google</button><button type="button">Continuar con GitHub</button></div>
    </section>
  </main>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="../assets/js/main.js"></script>
</body>
</html>
